apiVersion: apps/v1
kind: Deployment
metadata:
    name: sql-deployment
    labels:
       app: sql-server
spec:
    replicas: 1
    selector:
      matchLabels:
        app: sql-server
    template:
      metadata:
        labels:
           app: sql-server
      spec:
         containers:
           - name: sql-server
             image: mysql:latest
             env:
                - name: MYSQL_ROOT_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: sql-secret
                      key: MYSQL_ROOT_PASSWORD  
                - name: MYSQL_USER
                  value: "admin"    
                - name: MYSQL_PASSWORD
                  value: "admin"
                - name: MYSQL_DATABASE
                  value: "mydb"
             ports:
                - containerPort: 3306
             imagePullPolicy: Always
             volumeMounts:
                - name: mysqldata
                  mountPath: docker-entrypoint-initdb.d 
         volumes:
           - name: mysqldata
             configMap:
               name: sql-config
                  
